<script>
     function navigate(id) {

        //if you want the URL to open in the same window use '_parent'  instead of '_blank'. Key advice. Dl 0, dl 1 does NOT work apparently.
		//La historia es que si yo quiero no tener que poner este trozo de código en cada archivo, tendría que pasarle al IF las primeras letras del archivo en el que estoy, y así pillaría A47.

        if (id === "pdf")
          window.open(window.LINKS.AXXX.PDF, '_blank').focus(); // Partitura completa: más de 60 hojas en total.

        else if (id === "mp3") {
          window.open("window.LINKS.AXXX.MP3", '_blank').focus(); //Repentant MP3
        }
      }
	  (function(){
	 function setBodyBackground(){
		try{
			const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
			document.body.style.background = isDark ? '#191919' : '#ffffff';
		} catch(e) {
			document.body.style.background = '#ffffff';
			}
			}
			if(window.matchMedia){
			window.matchMedia('(prefers-color-scheme: dark)').addListener(setBodyBackground);
			}
			setBodyBackground();
			})();
    </script>
